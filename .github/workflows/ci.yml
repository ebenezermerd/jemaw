name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgres://${{ vars.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ vars.CI_POSTGRES_DB }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.CI_TELEGRAM_BOT_TOKEN }}
      BOT_MODE: ${{ vars.CI_BOT_MODE }}

    steps:
      - uses: actions/checkout@v4

      # Start Postgres in a step with retries so a transient Docker Hub pull
      # failure does not fail the build (services: blocks cannot be retried).
      - name: Start Postgres
        run: |
          for i in 1 2 3; do
            docker run -d --name jemaw-pg \
              -e POSTGRES_USER='${{ vars.CI_POSTGRES_USER }}' \
              -e POSTGRES_PASSWORD='${{ secrets.CI_POSTGRES_PASSWORD }}' \
              -e POSTGRES_DB='${{ vars.CI_POSTGRES_DB }}' \
              -p 5432:5432 postgres:16-alpine && break
            echo "pull/start attempt $i failed; retrying in 10s"; sleep 10
          done
          for i in $(seq 1 20); do
            docker exec jemaw-pg pg_isready -U '${{ vars.CI_POSTGRES_USER }}' -d '${{ vars.CI_POSTGRES_DB }}' && break
            sleep 2
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database schema
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
