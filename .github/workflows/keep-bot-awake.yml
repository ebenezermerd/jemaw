name: Keep bot awake

# Render's free plan sleeps a web service after 15 idle minutes. Pinging during
# waking hours (06:00-24:00 EAT) keeps replies instant while leaving the
# workspace's 750 free hours room for other services. Overnight, an incoming
# Telegram update wakes the bot on its own.
on:
  schedule:
    - cron: "*/10 3-20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://jemaw-bot.onrender.com/health
